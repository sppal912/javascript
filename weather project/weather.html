<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .weather-container {
            width: 400px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        #city-input, #state-input, #country-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #search-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .weather-card {
            text-align: center;
        }

        #weather-icon {
            width: 100px;
            height: 100px;
            margin: 10px auto;
        }

        #temperature {
            font-size: 2.5rem;
            margin: 10px 0;
        }

        #weather-condition {
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-box {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class="weather-container">

        <h1>Weather App</h1>

        <div class="search-box">
            <label for="city">City Name</label>
            <input type="text" id="city-input" placeholder="Kolkata">
            <label for="state">State Name</label>
            <input type="text" id="state-input" placeholder="West Bengal">
            <label for="country">Country Name</label>
            <input type="text" id="country-input" placeholder="India">
        
            <button id="search-btn">
                Search
            </button>
        </div>

        <div class="weather-card">

            <h2 id="city-name">
                Kolkata
            </h2>

            <img id="weather-icon" src="" alt="Weather Icon">

            <h3 id="temperature">
                28°C
            </h3>

            <p id="weather-condition">
                Cloudy
            </p>

            <div class="details">

                <div class="detail-box">
                    <span>Humidity</span>
                    <p id="humidity">
                        80%
                    </p>
                </div>

                <div class="detail-box">
                    <span>Wind</span>
                    <p id="wind-speed">
                        10 km/h
                    </p>
                </div>

            </div>

        </div>

    </div>
<script src="weather.js"></script>
</body>
</html>
